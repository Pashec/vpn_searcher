services:
  vpn_searcher:
    build: .
    container_name: vpn_searcher
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  vpn_bot:
    build: .
    container_name: vpn_bot
    restart: unless-stopped
    network_mode: host
    command: python bot.py
    env_file:
      - .env
    depends_on:
      - vpn_searcher
